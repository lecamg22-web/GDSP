services:
  - type: web
    name: gdsp-backend
    env: node
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
  - type: web
    name: gdsp-frontend
    env: node
    buildCommand: npm install
    startCommand: node frontend/server.js
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: SITE_URL
        sync: false
